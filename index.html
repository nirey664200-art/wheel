
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Свиданий</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Чуть увеличили контейнер, чтобы текст красиво ложился */
        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 40px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Градиент разделен на 10 равных секторов по 36 градусов */
            background: conic-gradient(
                #ff7597 0deg 36deg,
                #3498db 36deg 72deg,
                #2ecc71 72deg 108deg,
                #f1c40f 108deg 144deg,
                #9b59b6 144deg 180deg,
                #e67e22 180deg 216deg,
                #e74c3c 216deg 252deg,
                #1abc9c 252deg 288deg,
                #fd79a8 288deg 324deg,
                #6c5ce7 324deg 360deg
            );
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            animation: spinContinuous 3s linear infinite;
        }
        .stop {
            animation-play-state: paused !important;
        }
        /* Оптимизировали размер центра под длинный текст */
        .wheel-center {
            position: absolute;
            top: 95px;
            left: 95px;
            width: 150px;
            height: 150px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .wheel-text {
            color: #181818;
            font-size: 0.95rem;
            font-weight: bold;
            line-height: 1.3;
        }
        .stop-btn {
            background: #ff7597;
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .stop-btn:active {
            transform: scale(0.95);
        }
        @keyframes spinContinuous {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="wheel" id="wheelCircle"></div>
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Что выберем? 🤔</div>
        </div>
    </div>

    <button class="stop-btn" id="actionButton">ОСТАНОВИТЬ 🛑</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');
        const actionButton = document.getElementById('actionButton');

        // Обновленный список из 10 классных вариантов
        const options = [
            "Приготовить ужин вместе 🍳", 
            "Посмотреть фильм 🍿", 
            "Массаж 💆‍♂️", 
            "Прогулка в парке 🌳", 
            "Заказать пиццу 🍕", 
            "Настольные игры 🎲",
            "Заказать суши 🍣",
            "Спа и масочки 🧖‍♀️✨",
            "Сделать коктейли 🍹",
            "Порисовать или лепка 🎨"
        ];

        let isStopped = false;

        function handleAction() {
            if (isStopped) {
                wheel.classList.remove('stop');
                centerText.innerHTML = "Что выберем? 🤔";
                actionButton.innerHTML = "ОСТАНОВИТЬ 🛑";
                actionButton.style.background = "#ff7597";
                isStopped = false;
            } else {
                wheel.classList.add('stop');
                const randomIndex = Math.floor(Math.random() * options.length);
                centerText.innerHTML = options[randomIndex];
                actionButton.innerHTML = "КРУТИТЬ СНОВА 🔄";
                actionButton.style.background = "#3498db";
                isStopped = true;
            }
        }

        actionButton.onclick = handleAction;
        actionButton.ontouchstart = function(e) {
            e.preventDefault();
            handleAction();
        };
    </script>
</body>
</html>
