<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Свиданий</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
        }
        /* Колесо крутится само бесконечно и плавно */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7597 0deg 60deg,
                #3498db 60deg 120deg,
                #2ecc71 120deg 180deg,
                #f1c40f 180deg 240deg,
                #9b59b6 240deg 300deg,
                #e67e22 300deg 360deg
            );
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            animation: spinContinuous 12s linear infinite;
        }
        .wheel-center {
            position: absolute;
            top: 90px;
            left: 90px;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .wheel-text {
            color: #181818;
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.3;
        }
        /* CSS анимация бесконечного вращения */
        @keyframes spinContinuous {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="wheel"></div>
        <div class="wheel-center">
            <div class="wheel-text">Время<br>свидания! ❤️</div>
        </div>
    </div>

</body>
</html>
