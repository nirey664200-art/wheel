<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Свиданий</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            cursor: pointer;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7597 0deg 60deg,
                #3498db 60deg 120deg,
                #2ecc71 120deg 180deg,
                #f1c40f 180deg 240deg,
                #9b59b6 240deg 300deg,
                #e67e22 300deg 360deg
            );
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            /* Упрощенная плавная анимация */
            transition: transform 3s ease-out;
        }
        .wheel-center {
            position: absolute;
            top: 90px;
            left: 90px;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .wheel-text {
            color: #181818;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="wheel-container" id="spinArea">
        <div class="wheel" id="wheelCircle"></div>
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Жми, чтобы<br>крутить! ❤️</div>
        </div>
    </div>

    <script>
        // Инициализируем Telegram WebApp, если он есть
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');
        const spinArea = document.getElementById('spinArea');

        const options = [
            "Приготовить ужин вместе", 
            "Посмотреть фильм", 
            "Массаж", 
            "Прогулка в парке", 
            "Заказать пиццу", 
            "Настольные игры"
        ];

        let degrees = 0;
        let canSpin = true;

        function doRotation() {
            if (!canSpin) return;
            canSpin = false;

            centerText.innerHTML = "Крутится...";

            // Просто прибавляем случайные градусы (минимум 3 полных оборота)
            const extraDegrees = Math.floor(Math.random() * 360) + 1080;
            degrees += extraDegrees;
            
            // Вращаем колесо через CSS
            wheel.style.transform = rotate(${degrees}deg);

            // Через 3 секунды (когда анимация закончится) показываем случайный текст
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * options.length);
                centerText.innerHTML = options[randomIndex];
                canSpin = true;
            }, 3000);
        }

        // Привязываем запуск ко всем возможным видам нажатий
        spinArea.onclick = doRotation;
        spinArea.ontouchstart = function(e) {
            doRotation();
        };
    </script>
</body>
</html>
