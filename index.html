<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Контейнер строго по центру экрана */
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Яркое цветное колесо */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7597 0deg 60deg,
                #3498db 60deg 120deg,
                #2ecc71 120deg 180deg,
                #f1c40f 180deg 240deg,
                #9b59b6 240deg 300deg,
                #e67e22 300deg 360deg
            );
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            cursor: pointer;
        }
        /* Белая сердцевина для текста */
        .wheel-center {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            pointer-events: none; /* Чтобы клик проходил сквозь центр на колесо */
        }
        .wheel-text {
            color: #181818;
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <!-- Нажатие на этот круг запускает вращение -->
        <div class="wheel" id="wheelCircle"></div>
        
        <!-- Центр с подсказкой/результатом -->
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Жми, чтобы<br>крутить! ❤️</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');

        // Твои варианты для свидания
        const options = [
            "Приготовить ужин вместе", 
            "Посмотреть фильм", 
            "Массаж", 
            "Прогулка в парке", 
            "Заказать пиццу", 
            "Настольные игры"
        ];

        let currentRotation = 0;
        let isSpinning = false;

        wheel.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;

            centerText.innerHTML = "Крутится...";

            // Крутим минимум на 5 полных оборотов + случайный градус
            const randomDegrees = Math.floor(Math.random() * 360);
            currentRotation += 1800 + randomDegrees;
            
            wheel.style.transform = rotate(${currentRotation}deg);

            setTimeout(() => {
                isSpinning = false;
                
                // Рассчитываем, какой сектор оказался вверху
                const actualDegrees = currentRotation % 360;
                const sectorDegrees = 360 / options.length;
                const index = Math.floor(((360 - actualDegrees + 270) % 360) / sectorDegrees) % options.length;
                
                // Выводим результат прямо в центр колеса красивым текстом
                centerText.innerHTML = options[index];
            }, 4000); // Анимация длится 4 секунды
        });
    </script>
</body>
</html>
