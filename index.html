    <style>

            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #ff7597;
            text-align: center;
            padding: 0 20px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 40px;
        }
        canvas {
            width: 100%;

            box-shadow: 0 0 20px rgba(255, 117, 151, 0.3);
        }
        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff7597;
            z-index: 10;
        }
        button {
            background: #ff7597;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 151, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        button:active {
            transform: scale(0.95);
            background: #e05376;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <button id="spinBtn">Крутить колесо!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');

        const options = [

        const arc = 2 * Math.PI / numSectors;

        let isSpinning = false;

            ctx.clearRect(0, 0, 600, 600);
            for (let i = 0; i < numSectors; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                
                ctx.beginPath();
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 290, angle, angle + arc);
                ctx.lineTo(300, 300);
                ctx.fill();
                ctx.strokeStyle = '#181818';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Текст на секторах
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.textBaseline = 'middle';
                ctx.translate(300, 300);
                ctx.rotate(angle + arc / 2);
                ctx.fillText(options[i], 80, 0);
                ctx.restore();
            }
        }

</html>
