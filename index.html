<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Казино</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin-bottom: 30px;
        }
        /* 20 секторов (по 18 градусов каждый) */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #e74c3c 0deg 18deg, #2c3e50 18deg 36deg,
                #e74c3c 36deg 54deg, #2c3e50 54deg 72deg,
                #e74c3c 72deg 90deg, #2c3e50 90deg 108deg,
                #e74c3c 108deg 126deg, #2c3e50 126deg 144deg,
                #e74c3c 144deg 162deg, #2c3e50 162deg 180deg,
                #27ae60 180deg 198deg, #2c3e50 198deg 216deg,
                #e74c3c 216deg 234deg, #2c3e50 234deg 252deg,
                #e74c3c 252deg 270deg, #2c3e50 270deg 288deg,
                #e74c3c 288deg 306deg, #2c3e50 306deg 324deg,
                #e74c3c 324deg 342deg, #2c3e50 342deg 360deg
            );
            border: 10px solid #d4af37;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            animation: spinContinuous 2s linear infinite;
        }
        .stop { animation-play-state: paused !important; }
        
        .wheel-center {
            position: absolute;
            top: 105px; left: 105px;
            width: 140px; height: 140px;
            background: #ffffff;
            border-radius: 50%;
            border: 5px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 5px;
        }
        .wheel-text { color: #1a1a1a; font-size: 0.85rem; font-weight: bold; }
        
        .stop-btn {
            background: #d4af37;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5);
        }
        @keyframes spinContinuous { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="wheel-container">
        <div class="wheel" id="wheelCircle"></div>
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Ваш выбор? 🎰</div>
        </div>
    </div>
    <button class="stop-btn" id="actionButton">ОСТАНОВИТЬ 🛑</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');
        const actionButton = document.getElementById('actionButton');
        const options = ["Ужин 🍳", "Фильм 🍿", "Массаж 💆‍♂️", "Парк 🌳", "Пицца 🍕", "Игры 🎲", "Суши 🍣", "Спа 🧖‍♀️", "Коктейли 🍹", "Рисование 🎨"];
        let isStopped = false;
        function handleAction() {
            if (isStopped) {
                wheel.classList.remove('stop');
                centerText.innerHTML = "Ваш выбор? 🎰";
                actionButton.innerHTML = "ОСТАНОВИТЬ 🛑";
                isStopped = false;
            } else {
                wheel.classList.add('stop');
                centerText.innerHTML = options[Math.floor(Math.random() * options.length)];
                actionButton.innerHTML = "КРУТИТЬ 🔄";
                isStopped = true;
            }
        }
        actionButton.onclick = handleAction;
    </script>
</body>
</html>
