<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо свиданий</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #181818;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #ff7597;
            text-align: center;
            padding: 0 20px;
        }
        .wheel-container {
            position: relative;
            width: 290px;
            height: 290px;
        }
        .arrow {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #ff7597;
            z-index: 10;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.2, 1);
        }
        .spin-btn {
            margin-top: 35px;
            background: linear-gradient(135deg, #ff7597 0%, #ff527b 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 117, 151, 0.4);
            transition: 0.2s;
        }
        .spin-btn:active {
            transform: scale(0.95);
        }
        .spin-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Чем займемся сегодня? ❤️</h1>
    
    <div class="wheel-container">
        <div class="arrow"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Крутить колесо!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const activities = [
            "Катка в кооп 🎮",
            "Киномарафон 🍿",
            "Готовим ужин вместе 🌮",
            "Вечер коктейлей 🍹",
            "Долгая прогулка 🌌",
            "Пицца + Обнимашки 🍕",
            "Массаж любимому 💆‍♂️",
            "Настольные игры 🧩"
        ];

        const colors = ["#ff7597", "#3fcdbf", "#ffca3a", "#96bb7c", "#1dd3b0", "#b5179e", "#7209b7", "#4361ee"];
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const size = canvas.width;
        const center = size / 2;
        const sliceAngle = (2 * Math.PI) / activities.length;
        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            activities.forEach((activity, i) => {
                const angle = i * sliceAngle;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(center, center);
                ctx.arc(center, center, center, angle, angle + sliceAngle);
                ctx.lineTo(center, center);
                ctx.fill();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px -apple-system, BlinkMacSystemFont, sans-serif";
                ctx.textAlign = "right";
                ctx.
[04.06.2026 14:00] 𝕯𝖆𝖘𝖍𝖆: fillText(activity, center - 15, 5);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;

            const spins = 6 + Math.floor(Math.random() * 4);
            const randomAngle = Math.random() * 2 * Math.PI;
            currentRotation += spins * 2 * Math.PI + randomAngle;

            canvas.style.transform = rotate(${currentRotation}rad);

            setTimeout(() => {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;

                const normalizedAngle = (2 * Math.PI - (currentRotation % (2 * Math.PI))) % (2 * Math.PI);
                const winningIndex = Math.floor(((normalizedAngle + Math.PI / 2) % (2 * Math.PI)) / sliceAngle);
                
                const result = activities[winningIndex];
                
                tg.sendData(result);
                setTimeout(() => tg.close(), 800);
            }, 4000);
        }

        drawWheel();
    </script>
</body>
</html>
