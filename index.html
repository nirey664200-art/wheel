<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Казино</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Arial Black', sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin-bottom: 40px;
        }
        /* Красно-черный градиент казино */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #e74c3c 0deg 36deg, #2c3e50 36deg 72deg,
                #e74c3c 72deg 108deg, #2c3e50 108deg 144deg,
                #27ae60 144deg 180deg, #e74c3c 180deg 216deg,
                #2c3e50 216deg 252deg, #e74c3c 252deg 288deg,
                #2c3e50 288deg 324deg, #e74c3c 324deg 360deg
            );
            border: 8px solid #d4af37; /* Золотая рамка */
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            animation: spinContinuous 3s linear infinite;
        }
        .stop { animation-play-state: paused !important; }
        .wheel-center {
            position: absolute;
            top: 95px; left: 95px;
            width: 150px; height: 150px;
            background: #ffffff;
            border-radius: 50%;
            border: 4px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .wheel-text {
            color: #1a1a1a;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .stop-btn {
            background: #d4af37; /* Золотая кнопка */
            color: black;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }
        @keyframes spinContinuous { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="wheel-container">
        <div class="wheel" id="wheelCircle"></div>
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Делайте<br>ставки! 🎰</div>
        </div>
    </div>

    <button class="stop-btn" id="actionButton">ОСТАНОВИТЬ 🛑</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');
        const actionButton = document.getElementById('actionButton');

        const options = [
            "Ужин вместе 🍳", "Фильм 🍿", "Массаж 💆‍♂️", 
            "Парк 🌳", "Пицца 🍕", "Игры 🎲",
            "Суши 🍣", "Спа 🧖‍♀️", "Коктейли 🍹", "Рисование 🎨"
        ];

        let isStopped = false;
        function handleAction() {
            if (isStopped) {
                wheel.classList.remove('stop');
                centerText.innerHTML = "Делайте<br>ставки! 🎰";
                actionButton.innerHTML = "ОСТАНОВИТЬ 🛑";
                isStopped = false;
            } else {
                wheel.classList.add('stop');
                const randomIndex = Math.floor(Math.random() * options.length);
                centerText.innerHTML = options[randomIndex];
                actionButton.innerHTML = "КРУТИТЬ 🔄";
                isStopped = true;
            }
        }
        actionButton.onclick = handleAction;
    </script>
</body>
</html>
