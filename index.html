<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Колесо Свиданий</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #181818;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            cursor: pointer;
        }
        /* Колесо крутится само по себе */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7597 0deg 60deg,
                #3498db 60deg 120deg,
                #2ecc71 120deg 180deg,
                #f1c40f 180deg 240deg,
                #9b59b6 240deg 300deg,
                #e67e22 300deg 360deg
            );
            box-shadow: 0 0 25px rgba(255, 117, 151, 0.4);
            animation: spinContinuous 8s linear infinite;
        }
        /* Этот класс будет останавливать колесо при клике */
        .stop {
            animation-play-state: paused !important;
        }
        .wheel-center {
            position: absolute;
            top: 90px;
            left: 90px;
            width: 140px;
            height: 140px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .wheel-text {
            color: #181818;
            font-size: 0.95rem;
            font-weight: bold;
            line-height: 1.3;
        }
        @keyframes spinContinuous {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="wheel-container" id="mainButton">
        <div class="wheel" id="wheelCircle"></div>
        <div class="wheel-center">
            <div class="wheel-text" id="centerText">Нажми,<br>чтобы стоп! ❤️</div>
        </div>
    </div>

    <script>
        // Подключаем Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const wheel = document.getElementById('wheelCircle');
        const centerText = document.getElementById('centerText');
        const mainButton = document.getElementById('mainButton');

        // Твои варианты занятий
        const options = [
            "Приготовить ужин вместе 🍳", 
            "Посмотреть фильм 🍿", 
            "Массаж 💆‍♂️", 
            "Прогулка в парке 🌳", 
            "Заказать пиццу 🍕", 
            "Настольные игры 🎲"
        ];

        let isStopped = false;

        function handleStop() {
            // Если уже остановили, второй клик снова запускает колесо
            if (isStopped) {
                wheel.classList.remove('stop');
                centerText.innerHTML = "Нажми,<br>чтобы стоп! ❤️";
                isStopped = false;
            } else {
                // Останавливаем вращение CSS
                wheel.classList.add('stop');
                // Выбираем случайный вариант
                const randomIndex = Math.floor(Math.random() * options.length);
                centerText.innerHTML = options[randomIndex];
                isStopped = true;
            }
        }

        // Реагирует и на клики мышкой, и на тапы пальцем на смартфонах
        mainButton.onclick = handleStop;
        mainButton.ontouchstart = function(e) {
            e.preventDefault();
            handleStop();
        };
    </script>
</body>
</html>
